name: Android preview APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_PUBLIC_TMDB_READ_ACCESS_TOKEN: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Install required Android SDK packages
        # The hosted runner supplies accepted SDK licenses. EOF prevents this
        # workflow from accepting any additional license terms interactively.
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37" "build-tools;37.0.0" \
            "ndk;27.1.12297006" "cmake;3.30.5" < /dev/null
      - name: Build standalone arm64 preview
        working-directory: android
        # Expo's generated release variant uses its development signing key.
        # This APK is installable for review, not a Play Store release.
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --console=plain --max-workers=2
      - name: Verify and prepare APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/frame-preview-arm64.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs artifacts/frame-preview-arm64.apk
          cd artifacts
          sha256sum frame-preview-arm64.apk > frame-preview-arm64.apk.sha256
      - name: Upload preview APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: frame-preview-arm64
          path: |
            artifacts/frame-preview-arm64.apk
            artifacts/frame-preview-arm64.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
